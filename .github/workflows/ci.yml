name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -t . -p 'test_*.py'
      - run: python tools/check_publication.py .
      - run: python -m pip install --no-deps .
      - run: agent-harness --help
      - run: python tools/smoke_installed.py
